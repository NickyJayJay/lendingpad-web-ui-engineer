<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description"
    content="LendingPad user management table — sample UI for the Senior Web UI Engineer take-home." />
  <title>LendingPad — Sample Task</title>
  <link rel="stylesheet" href="./styles/main.scss" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>

<body>
  <main id="app" class="page">
    <header>
      <h1 class="u-sr-only">LendingPad — Sample Task</h1>
    </header>

    <section class="page__panel" aria-labelledby="users-title">
      <h2 id="users-title" class="u-sr-only">User list</h2>

      <div class="toolbar" role="search">
        <button class="btn btn--icon" type="button" aria-label="Filter">
          <i class="icon icon--filter" aria-hidden="true"></i>
        </button>

        <label class="input input--search">
          <i class="icon icon--search input__icon" aria-hidden="true"></i>
          <span class="u-sr-only">Search users</span>
          <input class="input__control" type="search" placeholder="Search..." />
        </label>

        <div class="toolbar__group toolbar__group--end">
          <button class="btn btn--primary" type="button">
            <i class="icon icon--plus" aria-hidden="true"></i>
            Add User
          </button>
        </div>
      </div>

      <div class="table-container">
        <table class="table" aria-label="Users">
          <thead class="table__head">
            <tr class="table__row">
              <th class="table__cell table__cell--head table__cell--select" scope="col">
                <label class="checkbox">
                  <input class="checkbox__input" type="checkbox" aria-label="Select all rows" />
                  <span class="checkbox__box" aria-hidden="true"></span>
                </label>
              </th>
              <th class="table__cell table__cell--head" scope="col" aria-sort="ascending">
                <button class="table__sort" type="button">
                  #
                  <span class="table__sort-icons" aria-hidden="true">
                    <i class="icon icon--up-sorting table__sort-icon table__sort-icon--up"></i>
                    <i class="icon icon--down-sorting table__sort-icon table__sort-icon--down"></i>
                  </span>
                </button>
              </th>
              <th class="table__cell table__cell--head table__cell--head-name" scope="col" aria-sort="none">
                <button class="table__sort" type="button">
                  Name
                  <span class="table__sort-icons" aria-hidden="true">
                    <i class="icon icon--up-sorting table__sort-icon table__sort-icon--up"></i>
                    <i class="icon icon--down-sorting table__sort-icon table__sort-icon--down"></i>
                  </span>
                </button>
              </th>
              <th class="table__cell table__cell--head table__cell--description" scope="col">Description</th>
              <th class="table__cell table__cell--head" scope="col" aria-sort="none">
                <button class="table__sort" type="button">
                  Status
                  <span class="table__sort-icons" aria-hidden="true">
                    <i class="icon icon--up-sorting table__sort-icon table__sort-icon--up"></i>
                    <i class="icon icon--down-sorting table__sort-icon table__sort-icon--down"></i>
                  </span>
                </button>
              </th>
              <th class="table__cell table__cell--head table__cell--numeric" scope="col">Rate</th>
              <th class="table__cell table__cell--head table__cell--numeric" scope="col">Balance</th>
              <th class="table__cell table__cell--head table__cell--numeric" scope="col">Deposit</th>
              <th class="table__cell table__cell--head table__cell--actions" scope="col" aria-label="Row actions"></th>
            </tr>
          </thead>
          <tbody class="table__body">
            <!-- Rows are rendered from src/js/data.js by users-table.js -->
          </tbody>
        </table>
      </div>

      <nav class="pagination" aria-label="Table pagination">
        <div class="pagination__group">
          <span class="pagination__status" data-pagination-status>1 </span>- 10 of 97
        </div>

        <div class="pagination__group pagination__group--end">
          <span class="pagination__label">Rows per page:</span>
          <div class="dropdown" data-dropdown="rows-per-page">
            <button class="btn btn--ghost" type="button" aria-haspopup="menu" aria-expanded="false">
              <span data-rows-per-page-label>10</span>
              <i class="icon icon--page-down" aria-hidden="true"></i>
            </button>
            <div class="dropdown__menu dropdown__menu--above" role="menu" hidden>
              <button class="dropdown__item" role="menuitem" type="button" data-value="5">5</button>
              <button class="dropdown__item dropdown__item--selected" role="menuitem" type="button"
                data-value="10">10</button>
              <button class="dropdown__item" role="menuitem" type="button" data-value="15">15</button>
              <button class="dropdown__item" role="menuitem" type="button" data-value="20">20</button>
              <button class="dropdown__item" role="menuitem" type="button" data-value="30">30</button>
              <button class="dropdown__item" role="menuitem" type="button" data-value="30">40</button>
              <button class="dropdown__item" role="menuitem" type="button" data-value="50">50</button>
            </div>
          </div>

          <button class="btn btn--icon" type="button" aria-label="Previous page" data-pagination="prev">
            <i class="icon icon--page-left" aria-hidden="true"></i>
          </button>
          <span class="pagination__status pagination__status--end"><span data-pagination-status>1</span>/10</span>
          <button class="btn btn--icon" type="button" aria-label="Next page" data-pagination="next">
            <i class="icon icon--page-right" aria-hidden="true"></i>
          </button>
        </div>
      </nav>
    </section>

    <!-- Cloned into each row's actions dropdown at init so we don't repeat the
         menu markup 12 times in the HTML. -->
    <template id="row-actions-menu">
      <div class="dropdown__menu" role="menu" hidden>
        <button class="dropdown__item" role="menuitem" type="button">
          Invite Consumer
          <i class="icon icon--invite-consumer" aria-hidden="true"></i>
        </button>
        <button class="dropdown__item" role="menuitem" type="button">
          Send Email
          <i class="icon icon--send-email" aria-hidden="true"></i>
        </button>
        <button class="dropdown__item" role="menuitem" type="button">
          Manage Cost Details
          <i class="icon icon--dollar-sign" aria-hidden="true"></i>
        </button>
      </div>
    </template>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>

</html>
